<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08090d"/>
      <stop offset="50%" stop-color="#12131a"/>
      <stop offset="100%" stop-color="#08090d"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#1db954"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="112" fill="none" stroke="#1db954" stroke-width="6" stroke-opacity="0.4"/>
  
  <!-- Outer Glow Circle -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#1db954" stroke-width="4" stroke-opacity="0.2"/>

  <!-- SoundWave Curved Bars (Spotify/SoundWave Theme) -->
  <g filter="url(#glow)">
    <!-- Wave 1 (Top) -->
    <path d="M140 185 C210 145, 302 145, 372 185" fill="none" stroke="url(#waveGrad)" stroke-width="32" stroke-linecap="round"/>
    <!-- Wave 2 (Middle) -->
    <path d="M165 256 C220 222, 292 222, 347 256" fill="none" stroke="url(#waveGrad)" stroke-width="30" stroke-linecap="round"/>
    <!-- Wave 3 (Bottom) -->
    <path d="M190 327 C230 302, 282 302, 322 327" fill="none" stroke="url(#waveGrad)" stroke-width="28" stroke-linecap="round"/>
  </g>
</svg>
